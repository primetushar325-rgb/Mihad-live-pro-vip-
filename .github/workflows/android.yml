name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Tests + Release APK
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    env:
      LH_TOOLS: /tmp/lh-tools
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Fetch Android build toolchain (aapt2, kotlinc, d8, zipalign, apksigner)
        run: ./tools/fetch-tools.sh

      - name: Run unit + protocol integration tests
        run: ./tools/test-protocol.sh

      # The dev signing keystore is generated on first run and cached, so
      # every CI build is signed with the SAME key (no forced uninstalls).
      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: keystore
          key: livehead-release-keystore-v1

      - name: Build release APK
        run: VERSION_NAME=2.0.0 VERSION_CODE=4 ./build.sh

      - name: Verify APK
        run: |
          java -jar /tmp/lh-tools/lib/apksigner.jar verify --print-certs release/LiveHead-v2.0.0.apk
          LD_LIBRARY_PATH=/tmp/lh-tools/lib64 /tmp/lh-tools/bin/zipalign -c 4 release/LiveHead-v2.0.0.apk
          python3 - <<'EOF'
          import zipfile
          b = zipfile.ZipFile('release/LiveHead-v2.0.0.apk').read('classes.dex')
          assert b[4:7] == b'035', f"dex version {b[4:7]} is not universally loadable"
          print('dex 035 OK (universally loadable)')
          EOF
          sha256sum release/LiveHead-v2.0.0.apk

      - name: Upload APK artifact (requires GitHub login)
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-HEAD-release
          path: release/LiveHead-v2.0.0.apk
          if-no-files-found: error

      # Release assets are publicly downloadable — this creates the direct
      # download link. Only for pushes to the working branch, so random
      # branches can't overwrite the published APK.
      - name: Publish APK to GitHub Release (public direct download)
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/38363f2a-mihad-live-pro-vip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create v2.0.0 --repo "$GITHUB_REPOSITORY" \
              --title "LIVE HEAD v2.0.0" \
              --notes "CI-built release APK (camera → RTMPS → YouTube live streamer)"
          gh release upload v2.0.0 release/LiveHead-v2.0.0.apk --clobber --repo "$GITHUB_REPOSITORY"
          echo "Direct link: https://github.com/$GITHUB_REPOSITORY/releases/download/v2.0.0/LiveHead-v2.0.0.apk"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: .cli-build/
          if-no-files-found: ignore
